<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e4b">
<title>متابعة حلقة التحفيظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f3;--card:#fff;--ink:#14231c;--mute:#5d6f66;--line:#dbe4df;
  --pri:#1b5e4b;--pri-d:#134436;--gold:#b8893b;
  --g1:#1b7f4f;--g2:#1f6f9c;--g3:#b9791c;--g4:#b23a3a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1713;--card:#18231d;--ink:#e8f0eb;--mute:#93a79c;--line:#2a3a32;--pri:#3aa085;--pri-d:#2c8a71}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.6;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{background:var(--pri);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:10px}
header h1{font-family:'Noto Naskh Arabic',serif;font-size:22px;margin:0;flex:1;line-height:1.4}
header .sub{font-size:13px;opacity:.85;display:block;font-family:Tajawal,sans-serif;font-weight:400}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;min-width:42px;height:42px;font:inherit;font-size:14px;padding:0 12px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:14px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.row:active{background:var(--bg)}
.av{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13.5px;color:var(--mute)}
.badge{font-size:12.5px;font-weight:700;color:#fff;border-radius:99px;padding:1px 10px;white-space:nowrap}
.gr1{background:var(--g1)}.gr2{background:var(--g2)}.gr3{background:var(--g3)}.gr4{background:var(--g4)}
.empty{text-align:center;color:var(--mute);padding:48px 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#fff;border:0;
  border-radius:16px;height:54px;padding:0 22px;font:inherit;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.chip b{display:block;font-size:20px}
.chip span{font-size:12.5px;color:var(--mute)}
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-inline-start:5px solid var(--line)}
.log.gr1{border-inline-start-color:var(--g1);background:var(--card)}
.log.gr2{border-inline-start-color:var(--g2);background:var(--card)}
.log.gr3{border-inline-start-color:var(--g3);background:var(--card)}
.log.gr4{border-inline-start-color:var(--g4);background:var(--card)}
.log .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.log .rng{font-weight:500}
.lbtns{display:flex;gap:14px;margin-top:6px}
.lnk{background:none;border:0;color:var(--pri);font:inherit;font-size:14px;padding:4px 0;cursor:pointer}
.lnk.del{color:var(--g4)}
.sec{font-weight:700;margin:6px 2px 10px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:'Noto Naskh Arabic',serif;margin:0 0 12px;font-size:21px}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px;color:var(--mute)}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grades input{position:absolute;opacity:0;width:0;min-height:0}
.grades label{margin:0;text-align:center;padding:11px 6px;border:2px solid var(--line);border-radius:12px;color:var(--ink);font-weight:700;cursor:pointer}
.grades input:checked+label{color:#fff;border-color:transparent}
.grades input[value="ممتاز"]:checked+label{background:var(--g1)}
.grades input[value="جيد جداً"]:checked+label{background:var(--g2)}
.grades input[value="جيد"]:checked+label{background:var(--g3)}
.grades input[value="إعادة"]:checked+label{background:var(--g4)}
.err{color:var(--g4);font-size:14px;margin-top:8px;min-height:20px}
.acts{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:0;border-radius:12px;min-height:50px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec2{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:90px;direction:ltr}
.note{font-size:13.5px;color:var(--mute);margin:0 0 12px}
input[type=file]{padding:9px 10px}
.revs{margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.rev{display:flex;align-items:center;gap:10px;font-size:14px;padding:3px 0}
.rev span:first-child{flex:1}
.arow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.aname{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.abtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ab{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-height:44px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.ab.on{color:#fff;border-color:transparent;font-weight:700}
.ab.p.on{background:var(--g1)}.ab.l.on{background:var(--g3)}.ab.e.on{background:var(--g2)}.ab.a.on{background:var(--g4)}
.alertbox{background:rgba(178,58,58,.14);border:1px solid var(--g4);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14.5px}
#adt{margin-bottom:10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.odtag{color:var(--g3);font-size:13.5px;font-weight:700}
.alertbox.warn{background:rgba(185,121,28,.14);border-color:var(--g3)}
a.btn{display:grid;place-items:center;text-decoration:none}
.an{margin-top:8px;min-height:40px;font-size:14px}
.grades input[value="n"]:checked+label,.grades input[value="r"]:checked+label{background:var(--pri)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحلقة">
<style>#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}#printArea img{display:block;width:210mm;height:297mm;object-fit:contain;break-after:page;page-break-after:always}@page{size:A4;margin:0}}</style>
<style>.wks{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}.wk{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 11px;font:inherit;font-size:14px;cursor:pointer}.wk.on,.dchip.on{background:var(--pri);color:#fff;border-color:transparent;font-weight:700}.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.dchip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer}input[readonly]{opacity:.7}</style>
<style>
html,body{max-width:100%;overflow-x:hidden}
*,*::before,*::after{min-width:0}
header{max-width:100%}
header h1{min-width:0;overflow-wrap:anywhere}
header .sub{overflow-wrap:anywhere}
main,.sheet{max-width:100%}
img,video,canvas,textarea,input,select{max-width:100%}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.acts{flex-wrap:wrap}
.btn,.hbtn{min-width:0;white-space:normal}
.row,.arow,.log{max-width:100%}
.name,.meta{overflow-wrap:anywhere}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<button class="fab" id="fab"></button>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const SURAHS="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const AYAHS=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const GRADES=["ممتاز","جيد جداً","جيد","إعادة"];
const GCLS={"ممتاز":"gr1","جيد جداً":"gr2","جيد":"gr3","إعادة":"gr4"};
const KEY="halaqa_v1";
const ORDER=[0,...Array.from({length:113},(_,k)=>113-k)];
const pos=i=>i===0?0:114-i;

let db=load(); db.att=db.att&&typeof db.att==="object"?db.att:{}; db.an=db.an&&typeof db.an==="object"?db.an:{}; db.students.forEach(s=>{if(s.last){s.name=(s.name+" "+s.last).trim();delete s.last}});db.since=db.since||new Date().toISOString().slice(0,10);db.qcap=Number.isInteger(db.qcap)&&db.qcap>=1?db.qcap:10;db.wmin=Number.isInteger(db.wmin)&&db.wmin>=1?db.wmin:2;db.skip=db.skip&&typeof db.skip==="object"?db.skip:{};db.pairs=db.pairs&&typeof db.pairs==="object"?db.pairs:{};db.ph=db.ph&&typeof db.ph==="object"?db.ph:{};db.hname=typeof db.hname==="string"&&db.hname?db.hname:"حلقة تحفيظ القرآن الكريم"; db.limit=Number.isInteger(db.limit)&&db.limit>=1?db.limit:3; let view={page:"home",sid:null};
const $=id=>document.getElementById(id);

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.students))return d}catch(e){}return{students:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("تعذر حفظ البيانات في المتصفح")}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=s=>new Date(s+"T00:00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
const range=l=>(l.kind==="r"?"مراجعة: ":"")+(l.fs===l.ts?`سورة ${SURAHS[l.fs]} من آية ${l.fa} إلى ${l.ta}`:`من ${SURAHS[l.fs]} (${l.fa}) إلى ${SURAHS[l.ts]} (${l.ta})`);
const student=()=>db.students.find(s=>s.id===view.sid);
const sortedLogs=s=>[...s.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));

function render(){
  const hd=$("hd"),app=$("app"),fab=$("fab");fab.style.display="";
  if(view.page==="home"){
    hd.innerHTML=`<h1>حلقة التحفيظ<span class="sub">${db.students.length} طالب</span></h1><button class="hbtn" data-act="backup">نسخ احتياطي</button>`;
    fab.textContent="+ إضافة طالب";fab.dataset.act="addStudent";
    app.innerHTML=homeTop()+searchBar()+(db.students.length?homeList().map(s=>{
      const last=sortedLogs(s)[0];
      return `<div class="row" data-act="open" data-id="${s.id}">
        <div class="av">${esc([...s.name][0]||"؟")}</div>
        <div class="grow"><div class="name">${esc(s.name)}</div>
        <div class="meta">${last?"آخر حفظ: "+esc(range(last))+" ("+s.logs.length+" جلسة)":"لا يوجد حفظ مسجّل بعد"}</div></div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${last?`<span class="badge ${GCLS[last.grade]}">${last.grade}</span>`:""}${warnBadge(s)}</div></div>`}).join("")
      :`<div class="empty"><b>لا يوجد طلاب بعد</b>اضغط «إضافة طالب» لتبدأ.</div>`);
  }else if(view.page==="att"){renderAtt();return}else if(view.page==="sess"){renderSess();return}else if(view.page==="cards"){renderCards();return}else if(view.page==="queue"){renderQueue();return}else if(view.page==="peers"){renderPeers();return}else if(view.page==="group"){renderGroup();return}else{
    const s=student(); if(!s){view.page="home";return render()}
    const logs=sortedLogs(s);
    hd.innerHTML=`<button class="hbtn" data-act="back" aria-label="رجوع">→</button>
      <h1>${esc(s.name)}<span class="sub">${logs.length} جلسة حفظ</span></h1>
      <button class="hbtn" data-act="editStudent">تعديل</button>
      <button class="hbtn" data-act="delStudent">حذف</button>`;
    fab.textContent="+ تسجيل حفظ";fab.dataset.act="addLog";
    const cnt=g=>logs.filter(l=>l.grade===g).length;
    app.innerHTML=topBlock(s)+`<div class="stats">${GRADES.map(g=>`<div class="chip"><b>${cnt(g)}</b><span>${g}</span></div>`).join("")}</div>
      ${attBlock(s)}${examBlock(s)}<div class="sec">سجل الحفظ</div>`+(logs.length?logs.map(l=>`<div class="log ${GCLS[l.grade]}">
        <div class="top"><span class="meta">${fmtDate(l.date)}</span><span class="badge ${GCLS[l.grade]}">${l.grade}</span></div>
        <div class="rng">${esc(range(l))}</div>${l.note?`<div class="meta">${esc(l.note)}</div>`:""}${odTag(l)}
        ${revList(l)}<div class="lbtns"><button class="lnk" data-act="addRev" data-id="${l.id}">+ إضافة مراجعة</button><button class="lnk" data-act="editLog" data-id="${l.id}">تعديل</button><button class="lnk del" data-act="delLog" data-id="${l.id}">حذف</button></div></div>`).join("")
        :`<div class="empty"><b>لا يوجد حفظ مسجّل</b>اضغط «تسجيل حفظ» لإضافة أول جلسة.</div>`);
  }
}

function openSheet(html){$("sheet").innerHTML=html;$("ov").classList.add("on");const f=$("sheet").querySelector("input,select");if(f&&f.type==="text")setTimeout(()=>f.focus(),50)}
function closeSheet(){stopScan();$("ov").classList.remove("on");if(view.page==="att")render()}

function studentForm(s){
  openSheet(`<h2>${s?"تعديل اسم الطالب":"إضافة طالب"}</h2>
   <label for="nm">الاسم واللقب</label><input id="nm" type="text" value="${s?esc(s.name):""}" maxlength="60" autocomplete="off">
   <label for="ph">رقم وليّ الأمر (اختياري، مع رمز الدولة بدون +)</label><input id="ph" type="tel" inputmode="tel" dir="ltr" value="${s?esc(s.phone||""):""}">
   <label for="sb">تاريخ الميلاد</label><input id="sb" type="date" value="${s?esc(s.bd||""):""}">
   <label for="sv">المستوى الدراسي</label><input id="sv" type="text" maxlength="40" placeholder="مثال: 5 ابتدائي" value="${s?esc(s.lvl||""):""}">
   <label for="ss">الرقم التسلسلي (إن تركته فارغاً يُحسب تلقائياً)</label><input id="ss" type="text" inputmode="numeric" maxlength="20" value="${s?esc(s.serial||""):""}">
   <label for="bs">آخر ما حفظه (للطالب القديم، اختياري)</label><div class="two"><select id="bs"><option value="">غير محدد</option>${surahOpts(s&&s.base?s.base.s:-1)}</select><input id="ba" type="number" inputmode="numeric" min="1" placeholder="آية" value="${s&&s.base?s.base.a:""}"></div>
   <div class="note" style="margin-top:4px">إن تركت الآية فارغة فيُحسب حفظه إلى نهاية السورة.</div>
   <div class="err" id="er"></div>
   <div class="acts"><button class="btn" data-act="saveStudent">حفظ</button><button class="btn sec2" data-act="close">إلغاء</button></div>`);
}
function surahOpts(sel){return ORDER.map(i=>`<option value="${i}" ${i===sel?"selected":""}>${SURAHS[i]}</option>`).join("")}
function logForm(l){
  const x=l||{...nextLog(student()),date:view.page==="sess"?view.date:today()};
  openSheet(`<h2>${l?"تعديل الحفظ":"تسجيل حفظ"}</h2>
   <label for="dt">التاريخ</label><input id="dt" type="date" value="${x.date}">
   <label>النوع</label><div class="grades"><input type="radio" name="kd" id="kn" value="n" ${x.kind==="r"?"":"checked"}><label for="kn">حفظ جديد</label><input type="radio" name="kd" id="kr" value="r" ${x.kind==="r"?"checked":""}><label for="kr">تسميع مراجعة</label></div>
   <label>من</label><div class="two"><select id="fs">${surahOpts(x.fs)}</select><input id="fa" type="number" inputmode="numeric" min="1" value="${x.fa}" aria-label="رقم الآية"></div>
   <label>إلى</label><div class="two"><select id="ts">${surahOpts(x.ts)}</select><input id="ta" type="number" inputmode="numeric" min="1" value="${x.ta}" aria-label="رقم الآية"></div>

function backupSheet(){
  openSheet(`<h2>نسخة احتياطية</h2>
   <div class="note">احفظ ملفاً بكل الطلاب وسجلات الحفظ، واستعده متى شئت أو على جهاز آخر.</div>
   <button class="btn" data-act="doExport">تصدير نسخة</button>
   <label for="imf">استيراد من ملف</label><input id="imf" type="file" accept=".json,application/json">
   <label for="imt">أو الصق نص النسخة هنا</label><textarea id="imt"></textarea>
   <div class="err" id="er"></div>
   <div class="acts"><button class="btn" data-act="doImport">استيراد ودمج</button><button class="btn sec2" data-act="close">إغلاق</button></div>`);

async function doExport(){
  const er=(m,ok)=>{$("er").textContent=m;$("er").style.color=ok?"var(--g1)":""};
  if(!db.students.length)return er("لا توجد بيانات لتصديرها.");
  const json=JSON.stringify({app:"halaqa",version:1,exported:new Date().toISOString(),students:db.students,att:db.att,an:db.an,hname:db.hname,limit:db.limit},null,1);
  if(typeof claude==="undefined"){try{const b=new Blob([json],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=`halaqa-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);db.lastExport=today();save();return er("تم تجهيز الملف. تحقق من مجلد التنزيلات.",true)}catch(e){}}
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(dl){
    try{await dl.save({filename:`halaqa-backup-${today()}.json`,data:json});db.lastExport=today();save();return er("تم تجهيز الملف.",true)}
    catch(e){if(e&&e.code==="declined")return er("أُلغي التصدير.")}
  }
  $("imt").value=json;$("imt").select();
  er("تعذر حفظ الملف مباشرة. انسخ النص في الخانة أدناه واحفظه في ملاحظاتك.");
}
async function doImport(){
  const er=(m,ok)=>{$("er").textContent=m;$("er").style.color=ok?"var(--g1)":""};
  let txt=$("imt").value.trim();
  const f=$("imf").files[0];
  if(f){try{txt=await f.text()}catch(e){return er("تعذرت قراءة الملف.")}}
  if(!txt)return er("اختر ملفاً أو الصق النص.");
  let d;try{d=JSON.parse(txt)}catch(e){return er("الملف غير صالح.")}
  const list=Array.isArray(d)?d:d&&d.students;
  if(!Array.isArray(list))return er("الملف غير صالح.");
  const okN=n=>Number.isInteger(n);
  let addS=0,addL=0;
  for(const s of list){
    if(!s||typeof s.name!=="string"||!s.name.trim())continue;
    const logs=(Array.isArray(s.logs)?s.logs:[]).filter(l=>l&&okN(l.fs)&&okN(l.ts)&&l.fs>=0&&l.fs<114&&l.ts>=0&&l.ts<114&&okN(l.fa)&&okN(l.ta)&&typeof l.date==="string"&&GRADES.includes(l.grade))
      .map(l=>({id:String(l.id||uid()),date:l.date,fs:l.fs,fa:l.fa,ts:l.ts,ta:l.ta,grade:l.grade,note:String(l.note||"").slice(0,200),kind:l.kind==="r"?"r":"n",revs:(Array.isArray(l.revs)?l.revs:[]).filter(v=>v&&typeof v.date==="string"&&GRADES.includes(v.grade)).map(v=>({id:String(v.id||uid()),date:v.date,grade:v.grade}))}));
    let cur=s.id?db.students.find(x=>x.id===String(s.id)):null;
    if(!cur){cur={id:String(s.id||uid()),name:(s.name.trim()+(s.last?" "+String(s.last).trim():"")).slice(0,60),phone:String(s.phone||"").replace(/\D/g,""),next:String(s.next||"").slice(0,200),bd:/^\d{4}-\d{2}-\d{2}$/.test(s.bd||"")?s.bd:"",lvl:String(s.lvl||"").slice(0,40),serial:String(s.serial||"").slice(0,20),base:(s.base&&Number.isInteger(s.base.s)&&s.base.s>=0&&s.base.s<114&&Number.isInteger(s.base.a)&&s.base.a>=1&&s.base.a<=AYAHS[s.base.s])?{s:s.base.s,a:s.base.a}:undefined,photo:typeof s.photo==="string"&&s.photo.startsWith("data:image/")&&s.photo.length<300000?s.photo:undefined,days:Array.isArray(s.days)?s.days.filter(i=>Number.isInteger(i)&&i>=0&&i<=6):[],logs:[]};db.students.push(cur);addS++}
    if(!(cur.days&&cur.days.length)&&Array.isArray(s.days))cur.days=s.days.filter(i=>Number.isInteger(i)&&i>=0&&i<=6);
    if(Array.isArray(s.hd)){cur.hd=[...new Set([...(cur.hd||[]),...s.hd.filter(v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v))])]}
    if(Array.isArray(s.exams)){cur.exams=cur.exams||[];for(const e of s.exams){if(e&&typeof e.title==="string"&&typeof e.date==="string"&&Number.isFinite(+e.score)&&!cur.exams.some(y=>y.id===String(e.id)))cur.exams.push({id:String(e.id||uid()),date:e.date,title:e.title.slice(0,60),score:+e.score,note:String(e.note||"").slice(0,120)})}}
    for(const l of logs){const ex=cur.logs.find(x=>x.id===l.id);if(!ex){cur.logs.push(l);addL++}else{ex.revs=ex.revs||[];for(const v of l.revs)if(!ex.revs.some(y=>y.id===v.id))ex.revs.push(v)}}
  }
  if(d&&d.att&&typeof d.att==="object"&&!Array.isArray(d.att)){
    const ids=new Set(db.students.map(s=>s.id));
    for(const day in d.att){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!d.att[day]||typeof d.att[day]!=="object")continue;
      for(const sid in d.att[day]){
        const v=d.att[day][sid];
        if(!ids.has(sid)||!["p","l","e","a"].includes(v))continue;
        const m=db.att[day]=db.att[day]||{};
        if(!(sid in m))m[sid]=v;
      }
    }
  }
  if(d&&d.an&&typeof d.an==="object"&&!Array.isArray(d.an)){const ids2=new Set(db.students.map(s=>s.id));for(const day in d.an){if(!d.an[day]||typeof d.an[day]!=="object")continue;for(const sid in d.an[day]){if(!ids2.has(sid))continue;const m=db.an[day]=db.an[day]||{};if(!(sid in m))m[sid]=String(d.an[day][sid]).slice(0,100)}}}
  save();render();
  er(`تم الاستيراد: ${addS} طالب جديد و${addL} تسجيل حفظ.`,true);
}

const ST=[["p","حاضر"],["l","متأخر"],["e","بعذر"],["a","غائب"]];
function absCount(sid){const f=new Date();f.setDate(f.getDate()-30);const from=f.toISOString().slice(0,10);let n=0;for(const d in db.att)if(d>=from&&db.att[d][sid]==="a")n++;return n}
function warnBadge(s){const n=absCount(s.id);const o=overdue(s).length;return (n>=db.limit?`<span class="badge gr4">غياب ${n}</span>`:"")+(o?`<span class="badge gr3">مراجعة ${o}</span>`:"")}
function attStats(sid){const c={p:0,l:0,e:0,a:0};for(const d in db.att){const v=db.att[d][sid];if(v)c[v]++}const t=c.p+c.l+c.e+c.a;return{c,rate:t?Math.round((c.p+c.l)/t*100):null}}
function attBlock(s){
  const {c,rate}=attStats(s.id),n=absCount(s.id);

   +(n>=db.limit?`<div class="alertbox">غاب ${n} أيام بلا عذر خلال آخر 30 يوماً. يُنصح بالتواصل مع وليّ الأمر.</div>`:"")
   +`<div class="stats">${ST.map(([k,tx])=>`<div class="chip"><b>${c[k]}</b><span>${tx}</span></div>`).join("")}</div>`;
}

const REV_DAYS=14,REV_WINDOW=60;
const dAgo=s=>Math.floor((new Date(today()+"T00:00:00")-new Date(s+"T00:00:00"))/864e5);
function odDays(l){if(dAgo(l.date)>REV_WINDOW)return 0;const d=dAgo([l.date,...(l.revs||[]).map(v=>v.date)].sort().pop());return d>=REV_DAYS?d:0}
function overdue(s){return s.logs.filter(l=>l.kind!=="r"&&odDays(l)>0)}

function progress(s){

  if(!b)return"";let n=b[1];for(let k=0;k<b[0];k++)n+=AYAHS[ORDER[k]];

}

function homeList(){
  const q=(view.q||"").trim(),k=view.sort||"name";
  const a=db.students.filter(s=>!q||s.name.includes(q));
  const last=s=>(sortedLogs(s)[0]||{date:""}).date;
  const sc=s=>(absCount(s.id)>=db.limit?2:0)+overdue(s).length;
  if(k==="recent")a.sort((x,y)=>last(y).localeCompare(last(x)));
  else if(k==="follow")a.sort((x,y)=>sc(y)-sc(x));

}

function reportText(s,days){
  const from=repFrom(s,days),to=today();
  const sd=x=>new Date(x+"T00:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"numeric"});
  const L=[`تقرير الطالب: ${s.name}`,`الفترة: ${sd(from)} - ${sd(to)}`,""];
  const c={p:0,l:0,e:0,a:0},ab=[];
  for(const d of Object.keys(db.att).sort())if(d>=from&&d<=to){const v=db.att[d][s.id];if(v){c[v]++;if(v==="a"||v==="e"){const n=(db.an[d]||{})[s.id];ab.push(`${sd(d)} ${v==="a"?"غياب":"غياب بعذر"}${n?" ("+n+")":""}`)}}}
  L.push(`الحضور: حاضر ${c.p}، متأخر ${c.l}، غياب بعذر ${c.e}، غائب ${c.a}`);
  ab.forEach(x=>L.push("- "+x));
  const lg=s.logs.filter(l=>l.date>=from&&l.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
  L.push("","الحفظ:");
  if(lg.length)lg.forEach(l=>L.push(`- ${sd(l.date)}: ${range(l)} (${l.grade})${l.note?" - "+l.note:""}`));else L.push("- لا يوجد");
  const rv=[];s.logs.forEach(l=>(l.revs||[]).forEach(v=>{if(v.date>=from&&v.date<=to)rv.push([v.date,`- ${sd(v.date)}: ${range(l)} (${v.grade})`])}));
  L.push("","المراجعة:");
  if(rv.length)rv.sort().forEach(x=>L.push(x[1]));else L.push("- لا يوجد");
  const ex=(s.exams||[]).filter(e=>e.date>=from&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
  L.push("","الاختبارات:");
  if(ex.length)ex.forEach(e=>L.push(`- ${sd(e.date)}: ${e.title} (${e.score}/100)${e.note?" - "+e.note:""}`));else L.push("- لا يوجد");
  if(s.next)L.push("","المطلوب للجلسة القادمة: "+s.next);
  return L.join("\n");
}

function loadPhoto(file,s){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const m=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext("2d").drawImage(im,0,0,c.width,c.height);s.photo=c.toDataURL("image/jpeg",.82);save();cardSheet(s,"id")};
    im.onerror=()=>{$("er").textContent="تعذّرت قراءة الصورة."};
    im.src=fr.result};
  fr.readAsDataURL(file);
}
async function idBody(x,s,F,W){
  const INK="#14231c",MUTE="#5d6f66",GOLD="#b8893b",bx=40,by=165,bw=250,bh=300;
  const box=()=>{x.beginPath();if(x.roundRect)x.roundRect(bx,by,bw,bh,16);else x.rect(bx,by,bw,bh)};
  if(s.photo){
    const im=new Image();await new Promise(r=>{im.onload=r;im.onerror=r;im.src=s.photo});
    if(im.width){x.save();box();x.clip();const k=Math.max(bw/im.width,bh/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,bx+(bw-w)/2,by+(bh-h)/2,w,h);x.restore()}
    x.strokeStyle=GOLD;x.lineWidth=4;x.setLineDash([]);
  }else{x.strokeStyle="#9aa9a1";x.lineWidth=3;x.setLineDash([12,9])}
  box();x.stroke();x.setLineDash([]);
  const bd=s.bd?new Date(s.bd+"T00:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"numeric",year:"numeric"}):"";
  const rows=[["الاسم واللقب",s.name],["تاريخ الميلاد",bd],["المستوى الدراسي",s.lvl||""],["الرقم التسلسلي",s.serial||String(db.students.indexOf(s)+1)]];
  const RX=W-40;
  rows.forEach(([lb,v],i)=>{
    const y=200+i*62;
    x.textAlign="right";x.font=F("700",28);const t=lb+":",lw=x.measureText(t).width;
    x.fillStyle=MUTE;x.fillText(t,RX,y);
    let z=30;x.font=F("400",z);const room=RX-lw-14-305;
    while(x.measureText(v).width>room&&z>14){z-=2;x.font=F("400",z)}
    x.fillStyle=INK;x.fillText(v,RX-lw-14,y);
    x.strokeStyle="#dbe4df";x.lineWidth=2;x.beginPath();x.moveTo(305,y+14);x.lineTo(RX,y+14);x.stroke();
  });
  if(typeof qrcode!=="undefined"){try{
    const q=qrcode(0,"M");q.addData("halaqa:"+s.id);q.make();
    const n=q.getModuleCount(),m=Math.floor(130/n),sz=m*n,qx=165-sz/2,qy=490;
    x.fillStyle="#fff";x.fillRect(qx-12,qy-12,sz+24,sz+24);x.fillStyle="#000";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(qx+c*m,qy+r*m,m,m);
  }catch(e){}}
  x.textAlign="center";x.font=F("700",26);x.fillStyle=MUTE;x.fillText("امسح الرمز لتسجيل الحضور",545,565);
}

function nextLog(s){

  if(!l)return b;

  if(l.ta>=AYAHS[l.ts]){const p=pos(l.ts)+1;if(p>113)return{...b,fs:l.ts,fa:AYAHS[l.ts],ts:l.ts,ta:AYAHS[l.ts]};fs=ORDER[p];fa=1}
  return{...b,fs,fa,ts:fs,ta:fa};
}

function decodeSnap(file){
  const msg=t=>{const m=$("sm");if(m)m.textContent=t};
  msg("جارٍ قراءة الصورة…");
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=async()=>{
      let id=null;
      for(const mx of [1000,1600,600]){
        const m=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);
        const cx=c.getContext("2d",{willReadFrequently:true});cx.drawImage(im,0,0,c.width,c.height);
        try{
          if("BarcodeDetector" in window){const r=await new BarcodeDetector({formats:["qr_code"]}).detect(c);if(r[0])id=r[0].rawValue}
          if(!id&&typeof jsQR!=="undefined"){const r=jsQR(cx.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r)id=r.data}
        }catch(e){}
        if(id)break;
      }
      if(!id)return msg("لم أجد رمز QR في الصورة. قرّب البطاقة وصوّرها بوضوح ثم حاول مجدداً.");
      if(!id.startsWith("halaqa:"))return msg("رمز غير معروف.");
      const s=byId(id.slice(7));
      if(!s)return msg("بطاقة غير معروفة.");
      markP(s);msg("✓ "+s.name+" — حاضر");
    };
    im.onerror=()=>msg("تعذّرت قراءة الصورة.");
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

const b64u=u8=>{let t="";u8.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function packRep(o){
  const u8=new TextEncoder().encode(JSON.stringify(o));
  if(typeof CompressionStream!=="undefined"){try{const cs=new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "z"+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}catch(e){}}
  return "j"+b64u(u8);
}
async function unpackRep(t){
  const u8=unb64u(t.slice(1));
  if(t[0]==="z"){const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(new TextDecoder().decode(new Uint8Array(await new Response(ds).arrayBuffer())))}
  return JSON.parse(new TextDecoder().decode(u8));
}
function repData(s,days){

  const lg=s.logs.filter(l=>l.date>=f&&l.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
  const rv=[];s.logs.forEach(l=>(l.revs||[]).forEach(v=>{if(v.date>=f&&v.date<=to)rv.push([v.date,shortR(l),v.grade])}));
  const ex=(s.exams||[]).filter(e=>e.date>=f&&e.date<=to).map(e=>[e.date,e.title,e.score]);
  const p=progInfo(s);
  return{v:1,h:db.hname,n:s.name,f,t:to,c:[c.p,c.l,c.e,c.a],l:lg.map(l=>[l.date,shortR(l),l.grade,l.kind==="r"?1:0,l.note||""]),r:rv.sort(),x:ex,nx:s.next||"",pg:p?[p.pct,p.sur,p.ay]:null};

function repFrom(s,days){
  if(days>0)return addD(today(),-(days-1));
  const ds=[...s.logs.map(l=>l.date),...Object.keys(db.att).filter(d=>db.att[d][s.id]),...(s.exams||[]).map(e=>e.date),today()].sort();
  return ds[0]||today();
}
function repSummary(s,days){
  const from=repFrom(s,days),to=today(),c={p:0,l:0,e:0,a:0};
  for(const d in db.att)if(d>=from&&d<=to&&db.att[d][s.id])c[db.att[d][s.id]]++;
  const tot=c.p+c.l+c.e+c.a,rate=tot?Math.round((c.p+c.l)/tot*100):null;
  const nl=s.logs.filter(l=>l.kind!=="r"&&l.date>=from&&l.date<=to).length;
  const nr=s.logs.reduce((n,l)=>n+(l.revs||[]).filter(v=>v.date>=from&&v.date<=to).length,0);
  const p=progInfo(s);
  return [
    `الحضور: ${rate===null?"—":rate+"%"} (حاضر ${c.p}، متأخر ${c.l}، بعذر ${c.e}، غائب ${c.a})`,
    `جلسات الحفظ: ${nl}`,
    `المراجعات: ${nr}`,
    p?`التقدم: ${p.pct}% — سورة ${p.sur} آية ${p.ay}`:"",
    s.next?`المطلوب القادم: ${s.next}`:""
  ].filter(Boolean).join("\n");
}

  const p=progInfo(s);

  const F=(w,z)=>`${w} ${z}px Tajawal,system-ui,sans-serif`;
  const T=(t,px,py,z,w,col,al,mx)=>{let zz=z;x.font=F(w,zz);while(mx&&x.measureText(t).width>mx&&zz>14){zz-=2;x.font=F(w,zz)}x.fillStyle=col;x.textAlign=al||"right";x.fillText(t,px,py)};
  const R=(a,b,w,h,r,f)=>{x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h);x.fillStyle=f;x.fill()};
  const badge=(t,right,cy,col)=>{x.font=F("700",24);const w=x.measureText(t).width+28;R(right-w,cy-19,w,38,19,col);T(t,right-w/2,cy+8,24,"700","#fff","center")};

      T([...s.name][0]||"؟",120,150,70,"700",PRI,"center");
      y=310;
      const avgE=ex.length?Math.round(ex.reduce((n,e)=>n+e.score,0)/ex.length):null;
      const tiles=[[rate===null?"—":rate+"%","نسبة الحضور",rate===null?MUTE:rate>=80?"#1b7f4f":rate>=60?"#b9791c":"#b23a3a"],[memo.length,"جلسات الحفظ",PRI],[rv.length,"مراجعات",PRI],[avgE===null?"—":avgE,"متوسط الاختبارات",PRI]];
      const tw=(W-120-60)/4;

      const ch=[["حاضر",c.p,AC.p],["متأخر",c.l,AC.l],["بعذر",c.e,AC.e],["غائب",c.a,AC.a]];

   <div class="acts"><button class="btn sec2" data-act="copyRep">نسخ النص</button><button class="btn sec2" data-act="close">إغلاق</button></div>`);
};

// ===== تصدير Excel (xlsx) =====
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const parts=[],central=[];let off=0;
  for(const f of files){
    const nameB=new TextEncoder().encode(f.name),data=f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nameB,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nameB.length,true);
    ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    off+=30+nameB.length+data.length;
  }
  const cdSize=central.reduce((n,a)=>n+a.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xmlE=v=>String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colL=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
function sheetXml(rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((r,ri)=>{
    x+=`<row r="${ri+1}">`;
    r.forEach((v,ci)=>{
      const ref=colL(ci)+(ri+1);
      if(v===null||v===undefined||v==="")return;
      if(typeof v==="number"&&isFinite(v))x+=`<c r="${ref}"><v>${v}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlE(v)}</t></is></c>`;
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function xlsxBlob(sheets){
  const enc=new TextEncoder(),H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const ct=H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const rels=H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb=H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((sh,i)=>`<sheet name="${xmlE(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+'</sheets></workbook>';
  const wbRels=H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const styles=H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>';
  const files=[{name:"[Content_Types].xml",data:enc.encode(ct)},{name:"_rels/.rels",data:enc.encode(rels)},{name:"xl/workbook.xml",data:enc.encode(wb)},{name:"xl/_rels/workbook.xml.rels",data:enc.encode(wbRels)},{name:"xl/styles.xml",data:enc.encode(styles)},...sheets.map((sh,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:enc.encode(sheetXml(sh.rows))}))];
  return zipStore(files);
}
function buildSheets(){
  const students=[["الاسم واللقب","رقم وليّ الأمر","تاريخ الميلاد","المستوى الدراسي","الرقم التسلسلي","أيام التسميع","آخر حفظ","نسبة التقدم %","نسبة الحضور %","عدد جلسات الحفظ"]];
  db.students.forEach((s,i)=>{
    const p=progInfo(s),{rate}=attStats(s.id),last=sortedLogs(s)[0];
    students.push([s.name,s.phone||"",s.bd||"",s.lvl||"",s.serial||String(i+1),(s.days||[]).slice().sort().map(d=>WDN[d]).join("، "),last?range(last):"",p?p.pct:"",rate===null?"":rate,s.logs.length]);
  });
  const memo=[["التاريخ","الطالب","النوع","من","إلى","التقدير","ملاحظة"]];
  const revs=[["التاريخ","الطالب","المقطع المُراجَع","التقدير"]];
  const att=[["التاريخ","الطالب","الحالة","ملاحظة"]];
  const exams=[["التاريخ","الطالب","الاختبار","الدرجة من 100","ملاحظة"]];
  db.students.forEach(s=>{
    [...s.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
      memo.push([l.date,s.name,l.kind==="r"?"مراجعة":"حفظ جديد",`${SURAHS[l.fs]} ${l.fa}`,`${SURAHS[l.ts]} ${l.ta}`,l.grade,l.note||""]);
      (l.revs||[]).forEach(v=>revs.push([v.date,s.name,shortR(l),v.grade]));
    });
    (s.exams||[]).forEach(e=>exams.push([e.date,s.name,e.title,e.score,e.note||""]));
  });
  for(const d of Object.keys(db.att).sort())for(const sid in db.att[d]){
    const s=byId(sid);if(!s)continue;
    att.push([d,s.name,ATX[db.att[d][sid]]||"",(db.an[d]||{})[sid]||""]);
  }
  return [{name:"الطلاب",rows:students},{name:"الحفظ",rows:memo},{name:"المراجعات",rows:revs},{name:"الحضور",rows:att},{name:"الاختبارات",rows:exams}];
}
function exportXlsx(){
  if(!db.students.length){alert("لا توجد بيانات لتصديرها.");return}
  const blob=xlsxBlob(buildSheets());
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download=`halaqa-${today()}.xlsx`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}
const _bk=backupSheet;
backupSheet=function(){
  _bk();
  const h=$("sheet").querySelector("h2"),b=document.createElement("div");
  b.innerHTML='<div class="acts" style="margin:0 0 12px"><button class="btn sec2" data-act="xlsx">تصدير Excel (جدول كامل للتحليل أو للمدير)</button></div>';
  if(h)h.after(b);
};
document.addEventListener("click",e=>{
  const t=e.target.closest&&e.target.closest("[data-act='xlsx']");

});
